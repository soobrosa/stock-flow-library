<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica,Arial,sans-serif">
<rect width="760" height="300" fill="white"/>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#111"/></marker></defs>
<text x="380.0" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">39. Gordon-Schaefer fishery (Gordon 1954 + Schaefer growth)</text>
<line x1="150" y1="160" x2="300" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="206" y="151" width="18" height="18" fill="#fff" stroke="#111" stroke-width="1.5" transform="rotate(45 215 160)"/>
<text x="215" y="145" text-anchor="middle" font-size="12" fill="#111">growth = r*P*(1-P/a)</text>
<line x1="418" y1="160" x2="570" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="481" y="151" width="18" height="18" fill="#fff" stroke="#111" stroke-width="1.5" transform="rotate(45 490 160)"/>
<text x="490" y="145" text-anchor="middle" font-size="12" fill="#111">harvest = c*E*P</text>
<line x1="360" y1="80" x2="360" y2="140" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="351" y="101" width="18" height="18" fill="#fff" stroke="#111" stroke-width="1.5" transform="rotate(45 360 110)"/>
<text x="360" y="95" text-anchor="middle" font-size="12" fill="#111">effort entry/exit = k*(L-C)</text>
<polyline points="490,180 240,40" fill="none" stroke="#555" stroke-width="1.3"/>
<text x="246" y="34" font-size="11" fill="#555">revenue per effort</text>
<rect x="300" y="140" width="118" height="40" rx="4" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="359.0" y="164.0" text-anchor="middle" font-size="12.5" fill="#111">Fish biomass</text>
<rect x="300" y="40" width="118" height="40" rx="4" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="359.0" y="64.0" text-anchor="middle" font-size="12.5" fill="#111">Fishing effort</text>
</svg>
